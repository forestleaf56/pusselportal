<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kattens Kawaii 15-Pussel 🐾</title>
    <!-- Google Fonts för kawaii-känsla -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS för layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti för firande -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #fff4f8;
            --board-bg: #ffe4ee;
            --board-border: #fca5c5;
            --tile-bg: #ffffff;
            --tile-shadow: #f4a6c8;
            --primary: #ff6b9d;
            --accent-purple: #c084fc;
            --accent-mint: #6ee7b7;
        }

        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(#ffd1dc 15%, transparent 16%),
                radial-gradient(#e0c3fc 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Brickans glidande animationer */
        .board-container {
            width: min(92vw, 380px);
            height: min(92vw, 380px);
            position: relative;
            background: var(--board-bg);
            border: 6px solid var(--board-border);
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(255, 107, 157, 0.25), inset 0 4px 10px rgba(255, 255, 255, 0.6);
            overflow: hidden;
        }

        .puzzle-tile {
            position: absolute;
            width: 25%;
            height: 25%;
            padding: 4px;
            transition: transform 0.18s cubic-bezier(0.34, 1.3, 0.64, 1);
            will-change: transform;
            cursor: pointer;
        }

        .tile-card {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 var(--tile-shadow), 0 8px 12px rgba(244, 166, 200, 0.3);
            position: relative;
            border: 2px solid #ffd0e1;
            transition: all 0.1s ease;
        }

        .puzzle-tile:active .tile-card {
            transform: translateY(3px);
            box-shadow: 0 3px 0 var(--tile-shadow), 0 4px 6px rgba(244, 166, 200, 0.3);
        }

        /* Kattöron på brickor */
        .ear-left, .ear-right {
            position: absolute;
            top: -6px;
            width: 14px;
            height: 14px;
            background: #ff9ebb;
            border-radius: 4px;
            z-index: 1;
        }

        .ear-left {
            left: 10px;
            transform: rotate(-30deg) skewX(-15deg);
        }

        .ear-right {
            right: 10px;
            transform: rotate(30deg) skewX(15deg);
        }

        .ear-left::after, .ear-right::after {
            content: '';
            position: absolute;
            top: 3px;
            width: 8px;
            height: 8px;
            background: #ffe5ec;
            border-radius: 2px;
        }
        .ear-left::after { left: 3px; }
        .ear-right::after { right: 3px; }

        /* Anpassade färger per rad eller bricka */
        .tile-cat-0 { background: #ffffff; }
        .tile-cat-1 { background: #fffbf0; }
        .tile-cat-2 { background: #fdf2f8; }
        .tile-cat-3 { background: #f5f3ff; }

        /* Knappar */
        .kawaii-btn {
            background: linear-gradient(180deg, #ff85af 0%, #ff528c 100%);
            box-shadow: 0 4px 0 #d93870, 0 6px 12px rgba(255, 82, 140, 0.3);
            transition: all 0.12s ease;
        }
        .kawaii-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #d93870;
        }

        .kawaii-btn-secondary {
            background: #ffffff;
            color: #ff528c;
            border: 2px solid #ffccd9;
            box-shadow: 0 4px 0 #fca5bb;
        }
        .kawaii-btn-secondary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #fca5bb;
        }

        /* Flytande tassavtryck som dekoration */
        .paw-deco {
            opacity: 0.15;
            pointer-events: none;
            position: absolute;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5 text-gray-700">

    <!-- Bakgrundsdekorationer -->
    <div class="paw-deco top-5 left-6 text-4xl select-none">🐾</div>
    <div class="paw-deco top-20 right-8 text-5xl select-none">🌸</div>
    <div class="paw-deco bottom-10 left-10 text-4xl select-none">🐱</div>
    <div class="paw-deco bottom-8 right-12 text-5xl select-none">🐾</div>

    <!-- Huvud-header -->
    <header class="text-center w-full max-w-sm mt-1">
        <div class="inline-flex items-center gap-2 bg-pink-100/80 px-4 py-1.5 rounded-full border border-pink-200 mb-1">
            <span class="text-xl">(=^･ω･^=)</span>
            <span class="text-xs uppercase tracking-wider font-bold text-pink-600">Kawaii Cat Edition</span>
        </div>
        <h1 class="text-3xl font-extrabold text-pink-600 drop-shadow-sm flex items-center justify-center gap-2">
            Kattens 15-Pussel
            <span class="text-2xl animate-bounce">🎀</span>
        </h1>
    </header>

    <!-- Statistik & Info -->
    <div class="w-full max-w-sm grid grid-cols-3 gap-2 my-2 text-center">
        <div class="bg-white/90 p-2 rounded-2xl border-2 border-pink-100 shadow-sm">
            <div class="text-[11px] font-bold text-pink-400 uppercase tracking-wide">Drag</div>
            <div id="moves-count" class="text-xl font-bold text-pink-600">0</div>
        </div>
        <div class="bg-white/90 p-2 rounded-2xl border-2 border-pink-100 shadow-sm">
            <div class="text-[11px] font-bold text-pink-400 uppercase tracking-wide">Tid</div>
            <div id="timer-display" class="text-xl font-bold text-pink-600">00:00</div>
        </div>
        <div class="bg-white/90 p-2 rounded-2xl border-2 border-pink-100 shadow-sm">
            <div class="text-[11px] font-bold text-pink-400 uppercase tracking-wide">Bästa</div>
            <div id="best-score" class="text-xl font-bold text-purple-500">-</div>
        </div>
    </div>

    <!-- Själva Spelplanen -->
    <main class="flex flex-col items-center justify-center relative">
        <div id="game-board" class="board-container relative">
            <!-- Brickor ritas ut dynamiskt -->
        </div>
        <!-- Tips / Hjälp -->
        <p class="text-xs text-pink-400/90 mt-2 font-medium tracking-wide flex items-center gap-1">
            <span>Klicka, svep eller använd piltangenter för att flytta</span> <span>🐾</span>
        </p>
    </main>

    <!-- Kontroller & Knappar -->
    <footer class="w-full max-w-sm flex flex-col gap-2.5 mt-2 mb-2">
        <div class="flex items-center gap-2">
            <button id="shuffle-btn" class="kawaii-btn flex-1 py-3 px-4 rounded-2xl text-white font-bold text-base flex items-center justify-center gap-2">
                <span>🔄</span> Blanda om
            </button>
            <button id="sound-btn" class="kawaii-btn-secondary p-3 rounded-2xl font-bold flex items-center justify-center text-lg w-12 h-12" title="Ljud Av/På">
                <span id="sound-icon">🔊</span>
            </button>
        </div>
        <div class="flex justify-between items-center text-xs text-pink-400 px-2 font-semibold">
            <span>Ordna siffrorna 1 till 15</span>
            <span id="status-tag" class="bg-white px-2 py-0.5 rounded-full border border-pink-200 text-pink-500">Klar att leka</span>
        </div>
    </footer>

    <!-- Vinst-popup / Modal -->
    <div id="win-modal" class="fixed inset-0 bg-pink-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center border-4 border-pink-300 shadow-2xl relative transform transition-all scale-95 opacity-0 duration-200" id="win-content">
            <div class="w-20 h-20 bg-pink-100 rounded-full mx-auto -mt-12 flex items-center justify-center border-4 border-white shadow-md text-4xl">
                😻
            </div>
            <h2 class="text-2xl font-black text-pink-600 mt-2">Mjaustastiskt!</h2>
            <p class="text-pink-400 text-sm font-semibold mt-1">Du löste kattpusslet!</p>
            
            <div class="bg-pink-50 rounded-2xl p-3 my-4 border border-pink-100 text-left space-y-1">
                <div class="flex justify-between text-xs font-bold text-gray-500">
                    <span>Antal drag:</span>
                    <span id="modal-moves" class="text-pink-600 text-sm">0</span>
                </div>
                <div class="flex justify-between text-xs font-bold text-gray-500">
                    <span>Tid:</span>
                    <span id="modal-time" class="text-pink-600 text-sm">00:00</span>
                </div>
                <div id="new-record-tag" class="hidden text-center text-xs font-extrabold text-amber-500 pt-1">
                    🌟 Nytt personbästa! 🌟
                </div>
            </div>

            <button id="play-again-btn" class="kawaii-btn w-full py-3 rounded-2xl text-white font-bold text-base shadow-lg">
                Spela Igen 🐾
            </button>
        </div>
    </div>

    <!-- JavaScript Spellogik & Web Audio -->
    <script>
        // Katt-ikoner & ansikten för de 15 brickorna
        const catEmoticons = [
            "ฅ^•ﻌ•^ฅ", "(=^･ｪ･^=)", "(^･o･^)ﾉ", "(=´∇｀=)", 
            "ฅ(ﾐ・ﻌ・ﾐ)ฅ", "(^._.^)ﾉ", "(=^ ◡ ^=)", "(=`ω´=)", 
            "(^◕ᴥ◕^)", "(=^-ω-^=)", "ฅ^•ﻌ•^ฅ", "(ﾉ^・ω・^)ﾉ", 
            "(=ФωФ=)", "(^=◕ᴥ◕=^)", "ฅ(=^･^=)"
        ];

        // Ljudmotor med Web Audio API
        class KawaiiSoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Sött mjukt mjau / pling vid drag
            playMove() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                // Mjuk oscillator med pitchen som böjs som ett litet kattmjau
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(780, now + 0.06);
                osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.13);
            }

            // Seger-melodi
            playVictory() {
                if (this.muted) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    const now = this.ctx.currentTime + (i * 0.12);
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.36);
                });
            }
        }

        const sound = new KawaiiSoundEngine();

        // Speltillstånd
        const GRID_SIZE = 4;
        let board = []; // 16 element: 1-15 och 0 för tom ruta
        let moves = 0;
        let timer = null;
        let secondsElapsed = 0;
        let isGameStarted = false;
        let isWon = false;

        // DOM-element
        const boardEl = document.getElementById('game-board');
        const movesEl = document.getElementById('moves-count');
        const timerEl = document.getElementById('timer-display');
        const bestScoreEl = document.getElementById('best-score');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const statusTag = document.getElementById('status-tag');
        const winModal = document.getElementById('win-modal');
        const winContent = document.getElementById('win-content');
        const playAgainBtn = document.getElementById('play-again-btn');
        const modalMoves = document.getElementById('modal-moves');
        const modalTime = document.getElementById('modal-time');
        const newRecordTag = document.getElementById('new-record-tag');

        // Initiering av spel
        function initGame() {
            loadBestScore();
            resetTimer();
            moves = 0;
            movesEl.innerText = moves;
            isWon = false;
            isGameStarted = false;
            statusTag.innerText = "Klar att leka";

            // Standard löst tillstånd
            board = Array.from({ length: 16 }, (_, i) => (i + 1) % 16);
            createTileElements();
            renderTilePositions();
            shuffleBoard();
        }

        // Skapa DOM-element för de 15 brickorna
        function createTileElements() {
            boardEl.innerHTML = '';
            for (let val = 1; val <= 15; val++) {
                const tile = document.createElement('div');
                tile.className = 'puzzle-tile';
                tile.dataset.value = val;

                const bgVariant = `tile-cat-${(val - 1) % 4}`;
                const emo = catEmoticons[val - 1];

                tile.innerHTML = `
                    <div class="tile-card ${bgVariant}">
                        <div class="ear-left"></div>
                        <div class="ear-right"></div>
                        <span class="text-xl sm:text-2xl font-black text-pink-600 tracking-tight leading-none">${val}</span>
                        <span class="text-[9px] sm:text-[10px] font-semibold text-pink-400 mt-1 select-none opacity-90">${emo}</span>
                        <div class="absolute bottom-1 right-1.5 opacity-20 text-[10px]">🐾</div>
                    </div>
                `;

                // Klick-lyssnare
                tile.addEventListener('click', () => {
                    handleTileClick(val);
                });

                boardEl.appendChild(tile);
            }
        }

        // Uppdatera brickornas visuella positioner (CSS transforms)
        function renderTilePositions() {
            for (let i = 0; i < 16; i++) {
                const val = board[i];
                if (val !== 0) {
                    const tileEl = boardEl.querySelector(`[data-value='${val}']`);
                    if (tileEl) {
                        const row = Math.floor(i / GRID_SIZE);
                        const col = i % GRID_SIZE;
                        tileEl.style.transform = `translate(${col * 100}%, ${row * 100}%)`;
                    }
                }
            }
        }

        // Hitta index för tomt hål (0)
        function getEmptyIndex() {
            return board.indexOf(0);
        }

        // Kontrollera om en bricka kan flyttas
        function canMove(index) {
            const emptyIdx = getEmptyIndex();
            const r1 = Math.floor(index / GRID_SIZE);
            const c1 = index % GRID_SIZE;
            const r2 = Math.floor(emptyIdx / GRID_SIZE);
            const c2 = emptyIdx % GRID_SIZE;

            return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
        }

        // Flytta bricka
        function moveTile(index, recordMove = true) {
            const emptyIdx = getEmptyIndex();
            board[emptyIdx] = board[index];
            board[index] = 0;

            if (recordMove) {
                if (!isGameStarted) {
                    startTimer();
                    isGameStarted = true;
                    statusTag.innerText = "Spelar...";
                }
                moves++;
                movesEl.innerText = moves;
                sound.playMove();
                renderTilePositions();
                checkWin();
            }
        }

        function handleTileClick(val) {
            if (isWon) return;
            const index = board.indexOf(val);
            if (canMove(index)) {
                moveTile(index, true);
            }
        }

        // Garanterat lösbar blandning genom slumpmässiga giltiga förflyttningar
        function shuffleBoard() {
            resetTimer();
            moves = 0;
            movesEl.innerText = moves;
            isWon = false;
            isGameStarted = false;
            statusTag.innerText = "Blandar...";

            // Utför många slumpmässiga giltiga steg bakåt från löst tillstånd
            const steps = 140;
            let lastEmpty = -1;

            for (let s = 0; s < steps; s++) {
                const emptyIdx = getEmptyIndex();
                const neighbors = [];
                const r = Math.floor(emptyIdx / GRID_SIZE);
                const c = emptyIdx % GRID_SIZE;

                if (r > 0) neighbors.push(emptyIdx - 4);
                if (r < 3) neighbors.push(emptyIdx + 4);
                if (c > 0) neighbors.push(emptyIdx - 1);
                if (c < 3) neighbors.push(emptyIdx + 1);

                // Undvik omedelbar bakåtrörelse
                const validMoves = neighbors.filter(idx => idx !== lastEmpty);
                const chosenIdx = validMoves.length > 0 
                    ? validMoves[Math.floor(Math.random() * validMoves.length)]
                    : neighbors[Math.floor(Math.random() * neighbors.length)];

                board[emptyIdx] = board[chosenIdx];
                board[chosenIdx] = 0;
                lastEmpty = emptyIdx;
            }

            renderTilePositions();
            statusTag.innerText = "Klar att leka";
        }

        // Tangentbordskontroll
        window.addEventListener('keydown', (e) => {
            if (isWon) return;
            const emptyIdx = getEmptyIndex();
            const r = Math.floor(emptyIdx / GRID_SIZE);
            const c = emptyIdx % GRID_SIZE;
            let targetIdx = -1;

            // Om man trycker pil ned vill man flytta brickan OVANFÖR nedåt
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
                if (r < 3) targetIdx = emptyIdx + 4;
            } else if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
                if (r > 0) targetIdx = emptyIdx - 4;
            } else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
                if (c < 3) targetIdx = emptyIdx + 1;
            } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
                if (c > 0) targetIdx = emptyIdx - 1;
            }

            if (targetIdx !== -1) {
                e.preventDefault();
                moveTile(targetIdx, true);
            }
        });

        // Touch swipe-stöd för mobil
        let touchStartX = 0;
        let touchStartY = 0;

        boardEl.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        boardEl.addEventListener('touchend', (e) => {
            if (isWon) return;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);

            if (Math.max(absX, absY) > 25) { // Minsta swipe-tröskel
                const emptyIdx = getEmptyIndex();
                const r = Math.floor(emptyIdx / GRID_SIZE);
                const c = emptyIdx % GRID_SIZE;
                let targetIdx = -1;

                if (absX > absY) {
                    // Horisontell swipe
                    if (dx > 0 && c > 0) targetIdx = emptyIdx - 1; // Höger swipe
                    else if (dx < 0 && c < 3) targetIdx = emptyIdx + 1; // Vänster swipe
                } else {
                    // Vertikal swipe
                    if (dy > 0 && r > 0) targetIdx = emptyIdx - 4; // Nedåt swipe
                    else if (dy < 0 && r < 3) targetIdx = emptyIdx + 4; // Uppåt swipe
                }

                if (targetIdx !== -1) {
                    moveTile(targetIdx, true);
                }
            }
        }, { passive: true });

        // Tidtagning
        function startTimer() {
            if (timer) clearInterval(timer);
            secondsElapsed = 0;
            timer = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerEl.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function resetTimer() {
            if (timer) clearInterval(timer);
            timer = null;
            secondsElapsed = 0;
            timerEl.innerText = "00:00";
        }

        // Kontrollera vinstvillkor
        function checkWin() {
            for (let i = 0; i < 15; i++) {
                if (board[i] !== i + 1) return false;
            }
            if (board[15] !== 0) return false;

            // VINST!
            isWon = true;
            if (timer) clearInterval(timer);
            statusTag.innerText = "🎉 Mjau! Du vann!";
            sound.playVictory();
            handleVictory();
            return true;
        }

        // Hantera vinst & Highscore
        function handleVictory() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            const timeStr = `${mins}:${secs}`;

            modalMoves.innerText = moves;
            modalTime.innerText = timeStr;

            // Spara rekord i localStorage baserat på minst drag
            const savedBest = localStorage.getItem('kawaii_cat_15_best_moves');
            if (!savedBest || moves < parseInt(savedBest, 10)) {
                localStorage.setItem('kawaii_cat_15_best_moves', moves);
                newRecordTag.classList.remove('hidden');
                loadBestScore();
            } else {
                newRecordTag.classList.add('hidden');
            }

            // Skjut konfetti
            triggerConfetti();

            // Visa vinstmodal med mjuk animering
            winModal.classList.remove('hidden');
            setTimeout(() => {
                winContent.classList.remove('scale-95', 'opacity-0');
                winContent.classList.add('scale-100', 'opacity-100');
            }, 30);
        }

        function loadBestScore() {
            const savedBest = localStorage.getItem('kawaii_cat_15_best_moves');
            if (savedBest) {
                bestScoreEl.innerText = `${savedBest} drag`;
            } else {
                bestScoreEl.innerText = "-";
            }
        }

        // Konfetti-effekt
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                const count = 180;
                const defaults = {
                    origin: { y: 0.65 },
                    colors: ['#ff6b9d', '#ffd1dc', '#c084fc', '#6ee7b7', '#fde047']
                };

                confetti({ ...defaults, particleCount: Math.floor(count * 0.4), spread: 60 });
                confetti({ ...defaults, particleCount: Math.floor(count * 0.3), spread: 100, decay: 0.91, scalar: 0.8 });
                confetti({ ...defaults, particleCount: Math.floor(count * 0.3), spread: 120, startVelocity: 25 });
            }
        }

        // Knapplyssnare
        shuffleBtn.addEventListener('click', () => {
            sound.init();
            shuffleBoard();
        });

        soundBtn.addEventListener('click', () => {
            sound.init();
            sound.muted = !sound.muted;
            soundIcon.innerText = sound.muted ? '🔇' : '🔊';
        });

        playAgainBtn.addEventListener('click', () => {
            winContent.classList.remove('scale-100', 'opacity-100');
            winContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                winModal.classList.add('hidden');
                shuffleBoard();
            }, 180);
        });

        // Starta spelet när sidan laddats
        window.addEventListener('load', () => {
            initGame();
        });
    </script>
</body>
</html>
