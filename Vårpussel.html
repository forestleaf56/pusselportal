<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vårpussel - Flow Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font and base styling */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e6f7eb; /* Soft spring green background */
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
            overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
        }

        /* Prevent all default touch actions on the board to allow smooth drawing */
        #board-container {
            touch-action: none;
        }

        .grid-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            z-index: 10;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            transition: transform 0.1s;
        }

        .grid-cell.active-endpoint {
            transform: scale(1.15);
            z-index: 20;
        }

        /* SVG Line styling */
        #lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.1));
        }

        /* Simple pop animation for win */
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* Modal Backdrop */
        #win-modal {
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header / UI -->
    <div class="max-w-md w-full flex flex-col items-center mb-6">
        <h1 class="text-4xl font-extrabold text-green-700 tracking-tight flex items-center gap-2 mb-2">
            🌸 Vårpussel 🌸
        </h1>
        <p class="text-green-600 font-semibold text-center mb-4">
            Koppla ihop vårtecknen utan att korsa linjerna!<br>
            <span class="text-sm font-bold text-green-800">OBS: Alla rutor på spelplanen måste fyllas.</span>
        </p>
        
        <div class="flex justify-between items-center w-full px-4 bg-white/70 p-3 rounded-2xl shadow-sm border border-green-200">
            <button id="btn-open-levels" class="flex items-center gap-2 px-4 py-2 bg-green-100 hover:bg-green-200 text-green-800 rounded-xl font-bold shadow-sm transition-transform active:scale-95">
                <span>🌱</span>
                <span id="level-display-label">Nivå 1</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
            <button id="btn-reset" class="bg-red-100 hover:bg-red-200 text-red-600 px-4 py-2 rounded-xl font-bold transition-colors shadow-sm active:scale-95">
                Börja om
            </button>
        </div>
    </div>

    <!-- Game Board -->
    <div id="board-container" class="relative max-w-md w-full aspect-square bg-white/60 backdrop-blur-md border-4 border-white shadow-xl rounded-3xl p-2">
        <svg id="lines-svg"></svg>
        <div id="grid" class="w-full h-full grid gap-1">
            <!-- Grid cells injected by JS -->
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 hidden flex items-center justify-center z-50 px-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center border-4 border-green-300">
            <div class="text-6xl mb-4">🌷🐝🦋</div>
            <h2 class="text-3xl font-extrabold text-green-700 mb-2">Härligt!</h2>
            <p class="text-gray-600 mb-6 font-semibold">Du kopplade ihop alla vårtecken!</p>
            <button id="btn-next" class="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-4 rounded-2xl shadow-md transition-transform active:scale-95">
                Nästa Nivå ➔
            </button>
        </div>
    </div>

    <!-- Level Selector Modal -->
    <div id="level-modal" class="fixed inset-0 hidden flex items-center justify-center z-50 p-4 bg-black/40 backdrop-blur-sm">
        <div class="bg-gradient-to-b from-green-50 to-white rounded-3xl shadow-2xl max-w-md w-full max-h-[85vh] flex flex-col border-4 border-green-200 overflow-hidden">
            <!-- Header -->
            <div class="flex items-center justify-between p-4 pb-2 border-b border-green-100">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🗺️</span>
                    <h2 class="text-xl font-black text-green-900 tracking-tight">Välj bana</h2>
                </div>
                <button id="btn-close-levels" class="w-9 h-9 flex items-center justify-center rounded-full bg-white hover:bg-gray-100 text-gray-500 border border-gray-200 font-bold text-lg active:scale-90 transition-transform">
                    ✕
                </button>
            </div>

            <!-- Category Tabs (Horizontal Scrollable) -->
            <div id="level-tabs" class="flex gap-2 p-3 overflow-x-auto no-scrollbar scroll-smooth border-b border-green-100/60">
                <!-- Tabs injected by JS -->
            </div>

            <!-- Levels Grid (Scrollable) -->
            <div class="flex-1 overflow-y-auto p-4">
                <div id="levels-grid-container" class="grid grid-cols-5 gap-2.5">
                    <!-- Level tiles injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables provided by system
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'varpussel-game';
        let db = null;
        let auth = null;
        let currentUser = null;

        async function initStorage() {
            if (typeof __firebase_config !== 'undefined') {
                try {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    const authPromise = typeof __initial_auth_token !== 'undefined' && __initial_auth_token
                        ? signInWithCustomToken(auth, __initial_auth_token)
                        : signInAnonymously(auth);

                    const cred = await authPromise;
                    currentUser = cred.user;
                    await loadProgressFromStorage();
                } catch (e) {
                    console.warn("Initieringsfel för sparfunktion:", e);
                }
            }
        }

        async function saveProgressToStorage() {
            if (!currentUser || !db) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'game_state');
                await setDoc(userDocRef, {
                    completedLevels: Array.from(window.completedLevels || []),
                    lastLevel: window.currentLevelIdx || 0,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (err) {
                console.error("Fel vid sparande av banor:", err);
            }
        }

        async function loadProgressFromStorage() {
            if (!currentUser || !db) return;
            try {
                const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'game_state');
                const snap = await getDoc(userDocRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data && Array.isArray(data.completedLevels)) {
                        data.completedLevels.forEach(lvl => window.completedLevels.add(lvl));
                        if (typeof data.lastLevel === 'number') {
                            window.currentLevelIdx = data.lastLevel;
                            window.initLevel();
                        }
                        if (window.renderLevelGridTiles) {
                            window.renderLevelGridTiles();
                        }
                    }
                }
            } catch (err) {
                console.error("Fel vid inläsning av sparade banor:", err);
            }
        }

        // Gör spara-metoden tillgänglig för spelets logik och kör igång
        window.saveGameProgress = saveProgressToStorage;
        initStorage();
    </script>

    <script>
        // --- Pseudo-random PRNG for consistent repeatable levels ---
        function createPRNG(seedValue) {
            let s = seedValue % 2147483647;
            if (s <= 0) s += 2147483646;
            return function() {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }

        // Robust generator för sammanhängande slingrande banor utan raka streck
        function generateConnectedLevel(size, numPairs, prng) {
            let totalCells = size * size;
            
            // Bygg en säker, sammanhängande rumsfyllande orm med alternerande svängar
            let path = [];
            for (let r = 0; r < size; r++) {
                if (r % 2 === 0) {
                    for (let c = 0; c < size; c++) path.push([r, c]);
                } else {
                    for (let c = size - 1; c >= 0; c--) path.push([r, c]);
                }
            }

            // Slumpa 4 olika speglingar/rotationer för att ge unik orientering
            let rot = Math.floor(prng() * 4);
            let flip = prng() > 0.5;
            
            function transform(p) {
                let r = p[0], c = p[1];
                if (flip) c = size - 1 - c;
                for (let k = 0; k < rot; k++) {
                    let oldR = r;
                    r = c;
                    c = size - 1 - oldR;
                }
                return [r, c];
            }
            let orientedPath = path.map(transform);

            // Dela in ormen i kurviga sektioner
            // Varje sektion måste vara minst 3 rutor lång (så det är minst 1 ruta emellan start och mål)
            let remainingCells = totalCells;
            let pairLengths = [];

            for (let i = 0; i < numPairs - 1; i++) {
                let pairsLeft = numPairs - 1 - i;
                let maxLen = remainingCells - (pairsLeft * 3);
                let avg = Math.floor(remainingCells / (pairsLeft + 1));
                let jitter = Math.floor((prng() - 0.5) * 3);
                let len = Math.max(3, Math.min(maxLen, avg + jitter));
                pairLengths.push(len);
                remainingCells -= len;
            }
            pairLengths.push(remainingCells);

            let pairs = [];
            let cursor = 0;
            for (let i = 0; i < numPairs; i++) {
                let len = pairLengths[i];
                let p1 = orientedPath[cursor];
                let p2 = orientedPath[cursor + len - 1];
                pairs.push([p1, p2]);
                cursor += len;
            }

            return { size, pts: pairs };
        }

        function getLevelData(levelIdx) {
            const SPRING_THEME = [
                { id: 'flower', icon: '🌸', color: '#F472B6' },
                { id: 'leaf',   icon: '🍃', color: '#4ADE80' },
                { id: 'bee',    icon: '🐝', color: '#FACC15' },
                { id: 'sun',    icon: '☀️', color: '#FBBF24' },
                { id: 'butterfly', icon: '🦋', color: '#60A5FA' },
                { id: 'ladybug', icon: '🐞', color: '#EF4444' },
                { id: 'tulip',  icon: '🌷', color: '#F43F5E' },
                { id: 'seedling', icon: '🌱', color: '#10B981' },
                { id: 'water',  icon: '💧', color: '#3B82F6' },
                { id: 'bird',   icon: '🐦', color: '#38BDF8' }
            ];

            let prng = createPRNG(levelIdx * 1337 + 42);

            // Progression: från 4x4 upp till 9x9
            let size, numPairs;
            if (levelIdx < 50) { size = 4; numPairs = 4; }
            else if (levelIdx < 100) { size = 5; numPairs = 5; }
            else if (levelIdx < 200) { size = 6; numPairs = 6; }
            else if (levelIdx < 300) { size = 7; numPairs = 7; }
            else if (levelIdx < 400) { size = 8; numPairs = 8; }
            else { size = 9; numPairs = 9; }

            let base = generateConnectedLevel(size, numPairs, prng);

            // Blanda färgtema för nivån
            let themes = [...SPRING_THEME];
            themes.sort(() => prng() - 0.5);

            let finalPairs = base.pts.map((p, idx) => ({
                id: themes[idx % themes.length].id + '_' + idx,
                icon: themes[idx % themes.length].icon,
                color: themes[idx % themes.length].color,
                pts: p
            }));

            return { size, pairs: finalPairs };
        }

        // --- Game State ---
        let currentLevelIdx = 0;
        let gridSize = 0;
        let currentPairs = [];
        let dotsMap = {}; // "r,c" -> pair object
        let paths = {};   // "id" -> array of [r, c]
        
        let isDrawing = false;
        let activePathId = null;
        let hasWon = false;
        const completedLevels = new Set(); // Sparar alla nivåer som klarats

        // Exponera för spar-skriptet
        window.completedLevels = completedLevels;
        window.currentLevelIdx = currentLevelIdx;
        window.initLevel = initLevel;

        // Categories configuration for level browser
        const LEVEL_CATEGORIES = [
            { name: "4x4 Lätt", range: [0, 49], size: 4 },
            { name: "5x5 Mellan", range: [50, 99], size: 5 },
            { name: "6x6 Klurig", range: [100, 199], size: 6 },
            { name: "7x7 Svår", range: [200, 299], size: 7 },
            { name: "8x8 Expert", range: [300, 399], size: 8 },
            { name: "9x9 Mästare", range: [400, 499], size: 9 }
        ];
        let selectedCategoryIdx = 0;

        // --- DOM Elements ---
        const gridEl = document.getElementById('grid');
        const svgEl = document.getElementById('lines-svg');
        const levelDisplayLabel = document.getElementById('level-display-label');
        const levelModal = document.getElementById('level-modal');
        const btnOpenLevels = document.getElementById('btn-open-levels');
        const btnCloseLevels = document.getElementById('btn-close-levels');
        const levelTabsContainer = document.getElementById('level-tabs');
        const levelsGridContainer = document.getElementById('levels-grid-container');
        const winModal = document.getElementById('win-modal');
        const btnNext = document.getElementById('btn-next');
        const boardContainer = document.getElementById('board-container');
        
        // --- Initialization ---
        function initLevel() {
            hasWon = false;
            winModal.classList.add('hidden');
            winModal.querySelector('div').classList.remove('animate-pop');

            const level = getLevelData(currentLevelIdx);
            gridSize = level.size;
            currentPairs = level.pairs;
            
            dotsMap = {};
            paths = {};
            isDrawing = false;
            activePathId = null;

            // Setup dots mapping
            currentPairs.forEach(pair => {
                paths[pair.id] = [];
                pair.pts.forEach(pt => {
                    dotsMap[`${pt[0]},${pt[1]}`] = pair;
                });
            });

            // Update UI
            levelDisplayLabel.textContent = `Nivå ${currentLevelIdx + 1} (${gridSize}x${gridSize})`;

            // Setup CSS Grid
            gridEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            gridEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
            
            // Setup SVG viewBox based on grid coordinates (1 unit = 1 cell)
            svgEl.setAttribute('viewBox', `0 0 ${gridSize} ${gridSize}`);

            renderGrid();
            renderPaths();
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            const dynFontSize = Math.min(2.5, 13 / gridSize) + 'rem';
            
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell bg-white/40 shadow-sm';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.style.fontSize = dynFontSize;
                    
                    const dot = dotsMap[`${r},${c}`];
                    if (dot) {
                        cell.innerHTML = dot.icon;
                        cell.style.animation = `pop 0.3s ease-out ${(r+c)*0.03}s both`;
                    }
                    
                    gridEl.appendChild(cell);
                }
            }
        }

        // --- Drawing Logic ---
        function getCellFromEvent(e) {
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const el = document.elementFromPoint(clientX, clientY);
            if (el) {
                if (el.classList.contains('grid-cell')) {
                    return { r: parseInt(el.dataset.r), c: parseInt(el.dataset.c) };
                }
                let parent = el.closest('.grid-cell');
                if (parent) {
                    return { r: parseInt(parent.dataset.r), c: parseInt(parent.dataset.c) };
                }
            }
            return null;
        }

        function startInteraction(e) {
            if (hasWon) return;
            const cell = getCellFromEvent(e);
            if (!cell) return;
            
            const r = cell.r;
            const c = cell.c;
            const dot = dotsMap[`${r},${c}`];

            if (dot) {
                isDrawing = true;
                activePathId = dot.id;
                paths[activePathId] = [[r, c]];
            } else {
                for (let id in paths) {
                    const path = paths[id];
                    const idx = path.findIndex(p => p[0] === r && p[1] === c);
                    if (idx !== -1) {
                        isDrawing = true;
                        activePathId = id;
                        paths[id] = path.slice(0, idx + 1);
                        break;
                    }
                }
            }
            renderPaths();
            animateEndpoint(r, c, true);
        }

        function moveInteraction(e) {
            if (!isDrawing || !activePathId || hasWon) return;
            
            const cell = getCellFromEvent(e);
            if (!cell) return;
            
            const { r, c } = cell;
            const currentPath = paths[activePathId];
            if (!currentPath || currentPath.length === 0) return;
            const lastPoint = currentPath[currentPath.length - 1];

            if (lastPoint[0] === r && lastPoint[1] === c) return;

            const dr = Math.abs(lastPoint[0] - r);
            const dc = Math.abs(lastPoint[1] - c);
            if (dr + dc !== 1) return; // Endast intilliggande steg

            const targetDot = dotsMap[`${r},${c}`];

            if (targetDot) {
                if (targetDot.id === activePathId) {
                    if (currentPath.length > 1 || (currentPath[0][0] !== r || currentPath[0][1] !== c)) {
                        currentPath.push([r, c]);
                        isDrawing = false;
                        renderPaths();
                        checkWinCondition();
                    }
                    return;
                } else {
                    return;
                }
            }

            const selfIdx = currentPath.findIndex(p => p[0] === r && p[1] === c);
            if (selfIdx !== -1) {
                paths[activePathId] = currentPath.slice(0, selfIdx + 1);
                renderPaths();
                return;
            }

            for (let id in paths) {
                if (id !== activePathId) {
                    const otherPath = paths[id];
                    const otherIdx = otherPath.findIndex(p => p[0] === r && p[1] === c);
                    if (otherIdx !== -1) {
                        paths[id] = otherPath.slice(0, otherIdx);
                    }
                }
            }

            currentPath.push([r, c]);
            renderPaths();
        }

        function endInteraction(e) {
            isDrawing = false;
            document.querySelectorAll('.grid-cell').forEach(el => el.classList.remove('active-endpoint'));
            activePathId = null;
            checkWinCondition();
        }

        function animateEndpoint(r, c, isActive) {
            const cells = document.querySelectorAll('.grid-cell');
            const target = Array.from(cells).find(el => parseInt(el.dataset.r) === r && parseInt(el.dataset.c) === c);
            if (target) {
                if (isActive) target.classList.add('active-endpoint');
                else target.classList.remove('active-endpoint');
            }
        }

        // --- Render SVG Lines ---
        function renderPaths() {
            svgEl.innerHTML = '';
            
            for (const [id, path] of Object.entries(paths)) {
                if (path.length === 0) continue;
                
                const pairConfig = currentPairs.find(p => p.id === id);
                if (!pairConfig) continue;

                const pointStrings = path.map(p => `${p[1] + 0.5},${p[0] + 0.5}`);
                
                const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                polyline.setAttribute('points', pointStrings.join(' '));
                polyline.setAttribute('stroke', pairConfig.color);
                polyline.setAttribute('stroke-width', '0.25');
                polyline.setAttribute('fill', 'none');
                polyline.setAttribute('stroke-linecap', 'round');
                polyline.setAttribute('stroke-linejoin', 'round');
                
                const backgroundLine = polyline.cloneNode();
                backgroundLine.setAttribute('stroke', '#ffffff');
                backgroundLine.setAttribute('stroke-width', '0.45');
                backgroundLine.setAttribute('opacity', '0.6');
                
                svgEl.appendChild(backgroundLine);
                svgEl.appendChild(polyline);
            }
        }

        // --- Win Logic ---
        function checkWinCondition() {
            if (hasWon || currentPairs.length === 0) return;

            let allConnected = true;
            let filledCells = new Set();

            for (const pair of currentPairs) {
                const path = paths[pair.id];
                if (!path || path.length < 2) {
                    allConnected = false;
                    break;
                }
                
                path.forEach(p => filledCells.add(`${p[0]},${p[1]}`));
                
                const first = path[0];
                const last = path[path.length - 1];
                const eps = pair.pts;
                
                const matchesNormal = (first[0] === eps[0][0] && first[1] === eps[0][1] && last[0] === eps[1][0] && last[1] === eps[1][1]);
                const matchesReverse = (first[0] === eps[1][0] && first[1] === eps[1][1] && last[0] === eps[0][0] && last[1] === eps[0][1]);
                
                if (!matchesNormal && !matchesReverse) {
                    allConnected = false;
                    break;
                }
            }

            // Garantera att alla par är kopplade OCH att alla rutor är 100% fyllda
            if (allConnected && filledCells.size === (gridSize * gridSize)) {
                hasWon = true;
                completedLevels.add(currentLevelIdx);
                window.currentLevelIdx = currentLevelIdx;
                if (window.saveGameProgress) {
                    window.saveGameProgress();
                }
                showWinModal();
            }
        }

        function showWinModal() {
            winModal.classList.remove('hidden');
            winModal.querySelector('div').classList.add('animate-pop');
            
            if (currentLevelIdx >= 499) {
                btnNext.innerText = "Du har klarat alla nivåer! 🎉";
            } else {
                btnNext.innerText = "Nästa Nivå ➔";
            }
        }

        function handleNextLevel() {
            winModal.classList.add('hidden');
            if (currentLevelIdx >= 499) {
                currentLevelIdx = 0;
            } else {
                currentLevelIdx++;
            }
            initLevel();
        }

        btnNext.addEventListener('click', handleNextLevel);
        btnNext.addEventListener('touchend', (e) => {
            e.stopPropagation();
            handleNextLevel();
        });

        // --- Event Listeners ---
        boardContainer.addEventListener('mousedown', startInteraction);
        window.addEventListener('mousemove', moveInteraction);
        window.addEventListener('mouseup', endInteraction);

        boardContainer.addEventListener('touchstart', startInteraction, { passive: false });
        window.addEventListener('touchmove', moveInteraction, { passive: false });
        window.addEventListener('touchend', endInteraction);
        window.addEventListener('touchcancel', endInteraction);

        document.getElementById('btn-reset').addEventListener('click', initLevel);

        // --- Level Selector Menu Logic ---
        function renderLevelTabs() {
            levelTabsContainer.innerHTML = '';
            LEVEL_CATEGORIES.forEach((cat, idx) => {
                const btn = document.createElement('button');
                const isActive = idx === selectedCategoryIdx;
                btn.className = `flex-shrink-0 h-9 px-4 rounded-full font-bold text-xs leading-none flex items-center justify-center whitespace-nowrap transition-all shadow-sm ${
                    isActive 
                        ? 'bg-green-600 text-white shadow-md shadow-green-300 ring-2 ring-green-600/30' 
                        : 'bg-white text-green-800 hover:bg-green-100/80 border border-green-200'
                }`;
                btn.textContent = cat.name;
                btn.onclick = () => {
                    selectedCategoryIdx = idx;
                    renderLevelTabs();
                    renderLevelGridTiles();
                    btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                };
                levelTabsContainer.appendChild(btn);
            });
        }

        function renderLevelGridTiles() {
            levelsGridContainer.innerHTML = '';
            const cat = LEVEL_CATEGORIES[selectedCategoryIdx];
            const [start, end] = cat.range;

            for (let i = start; i <= end; i++) {
                const tile = document.createElement('button');
                const isCurrent = i === currentLevelIdx;
                const isCompleted = completedLevels.has(i);

                let tileClasses = 'relative h-12 rounded-2xl font-extrabold text-sm flex items-center justify-center transition-all active:scale-95 border ';
                
                if (isCurrent) {
                    tileClasses += 'bg-gradient-to-tr from-green-500 to-emerald-400 text-white shadow-lg shadow-green-300/50 border-green-500 ring-2 ring-green-400 scale-105 z-10';
                } else if (isCompleted) {
                    tileClasses += 'bg-emerald-50 text-emerald-800 border-emerald-300 hover:bg-emerald-100 shadow-sm';
                } else {
                    tileClasses += 'bg-white hover:bg-green-50 text-gray-700 border-green-100 shadow-sm';
                }

                tile.className = tileClasses;
                tile.innerHTML = `
                    <span>${i + 1}</span>
                    ${isCompleted ? '<span class="absolute top-1 right-1 text-[10px] leading-none">🌸</span>' : ''}
                `;

                tile.onclick = () => {
                    currentLevelIdx = i;
                    window.currentLevelIdx = currentLevelIdx;
                    levelModal.classList.add('hidden');
                    initLevel();
                    if (window.saveGameProgress) {
                        window.saveGameProgress();
                    }
                };
                levelsGridContainer.appendChild(tile);
            }
        }
        window.renderLevelGridTiles = renderLevelGridTiles;

        function openLevelModal() {
            if (!levelModal) return;
            const currentCatIdx = LEVEL_CATEGORIES.findIndex(
                cat => currentLevelIdx >= cat.range[0] && currentLevelIdx <= cat.range[1]
            );
            if (currentCatIdx !== -1) {
                selectedCategoryIdx = currentCatIdx;
            }
            renderLevelTabs();
            renderLevelGridTiles();
            levelModal.classList.remove('hidden');

            setTimeout(() => {
                if (levelTabsContainer && levelTabsContainer.children[selectedCategoryIdx]) {
                    levelTabsContainer.children[selectedCategoryIdx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }, 50);
        }

        if (btnOpenLevels) btnOpenLevels.addEventListener('click', openLevelModal);
        if (btnCloseLevels) btnCloseLevels.addEventListener('click', () => levelModal.classList.add('hidden'));
        if (levelModal) {
            levelModal.addEventListener('click', (e) => {
                if (e.target === levelModal) levelModal.classList.add('hidden');
            });
        }

        // Start game
        window.onload = initLevel;

    </script>
</body>
</html>
